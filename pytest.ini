[pytest]
# Bare `pytest` with no path used to walk the whole rootdir: it dragged in
# tools/test_lw_clean_dekel.py (imports skimage, which lives only in the
# cv-lane venv) and even stray tests under Claude extension directories, so
# it died at collection with 2 errors while `pytest tests/` was green.
# testpaths only applies when no path argument is given, so the explicit CI
# invocations (`pytest tests/ -q`, `pytest tests/test_lw_clean_dekel_align.py`)
# are unaffected.
testpaths = tests
