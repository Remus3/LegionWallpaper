# AUDIT 2026-07-03 (LW bring-up): CI bare-minimum guard for the young
# Legion Wallpaper repo. py_compile every .py + ruff + the authored-source
# hygiene tests in tests/. Catches drift before it lands on main.
# Product test suites: TBD - product not yet defined; widen the pytest
# surface (and the nightly job) as the LW engine grows.

name: ci

on:
  # NO paths-ignore, deliberately. It carried `**/*.md` from 2026-06-30 as a
  # MINUTE SAVER, and the justification written here was that the ASCII-hygiene
  # guard is backstopped by precommit_gate.py so "nothing authored slips past on
  # a docs-only push". That is true of GLYPHS and false of everything else: the
  # git hook checks staged lines for banned characters, it does not run the
  # tests. Guards that read tracked .md off disk and assert on its CONTENT were
  # skipped by the exact commits most likely to break them.
  #
  # RC hit it twice in a row on 2026-07-27 with this filter in place: a docs-only
  # commit pushed a plan row past a director-context byte cap and turned a .py
  # guard RED with no CI run, and the docs-only FIX for that also ran no CI, so
  # its own green was never machine-confirmed.
  #
  # LW deliberately diverges from RC's fix here. RC added a separate docs-guard
  # workflow plus a selector, because its skipped suite includes playwright,
  # mypy and a Share sync and docs-only commits are ~55% of its history. LW's
  # whole suite is ~28s with none of that, so the complement would cost more
  # complexity than the filter ever saved. Dropping the filter also retires the
  # not-evaluated ambiguity that only existed because of it (f1 item 12).
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'  # Nightly full run (also covers a quiet day with no pushes)
  workflow_dispatch:       # manual trigger to verify the full suite on demand

# MINUTE SAVER (carried from RC 2026-06-30): cancel a superseded in-progress
# run when a newer commit lands on the same ref, so rapid pushes do not each
# bill to completion. event_name is in the group so a push never cancels the
# nightly schedule run (or vice versa) - only same-event runs supersede each
# other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  nightly-full-suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is dev-toolchain-only for now (pytest + ruff) -
          # the tree is pure stdlib so far. When runtime deps appear they go
          # in requirements.txt too (mirroring the nightly/check split: the
          # nightly installs the full runtime stack, the per-push check stays
          # minimal). The file also keys the setup-python pip cache.
          pip install -r requirements.txt
      - name: arm the git-hook gate
        run: |
          # Same reason as the check job's copy of this step: core.hooksPath is
          # LOCAL config and is never cloned, so the tracked .githooks gate is
          # INERT on a fresh checkout. Without this the suite's own
          # gate-is-active assertion fails on a correct tree - which is what
          # turned the nightly RED for two consecutive nights while every push
          # stayed green, because only the check job was armed when queue item
          # (6) landed. tests/test_ci_gate_arming.py is what keeps the two jobs
          # (and any third) in parity from here.
          python tools/install_git_hooks.py
          python tools/install_git_hooks.py --check
      - name: py_compile sweep
        run: |
          # Same sweep as the check job - see the comment there.
          python - <<'PY'
          import py_compile, sys
          from pathlib import Path
          fails, count = [], 0
          for p in Path(".").rglob("*.py"):
              parts = p.parts
              if "__pycache__" in parts or "_archive" in parts or ".git" in parts:
                  continue
              count += 1
              try:
                  py_compile.compile(str(p), doraise=True)
              except Exception as exc:
                  fails.append((p, exc))
          if fails:
              for p, exc in fails:
                  print(f"FAIL: {p}: {exc}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {count} .py files compile clean")
          PY
      - name: ruff lint
        run: ruff check .
      - name: Full test suite
        run: |
          # Same surface as the check job for now - the split exists so the
          # nightly can absorb slow/full product suites (TBD - product not
          # yet defined) without slowing per-push CI.
          pytest tests/ -q --tb=short
      # The style drift gate used to live here, nightly-only, because the .md
      # surface it scans was excluded from per-push CI. That filter is gone, so
      # the gate moved to the `check` job where it can block rather than report.
      # Not duplicated here: a nightly copy would only ever re-check a tree that
      # the push gate already refused to let land.

  check:
    if: github.event_name != 'schedule'

    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          # Test runner + linter only - LW has no runtime stack yet;
          # everything in tests/ is pure stdlib. requirements.txt carries
          # just the dev toolchain and keys the setup-python pip cache.
          pip install -r requirements.txt

      - name: arm the git-hook gate
        run: |
          # core.hooksPath is LOCAL config and is never cloned, so a CI
          # checkout has the tracked .githooks gate INERT - the exact
          # false-green CLAUDE.md warns about. Run the repo's own installer
          # rather than setting the config by hand: that way CI also proves
          # the installer works, and --check is the authoritative probe.
          python tools/install_git_hooks.py
          python tools/install_git_hooks.py --check

      - name: py_compile sweep
        run: |
          # Every .py in the checkout. A CI checkout contains tracked files
          # only, so gitignored dirs (_archive/, __pycache__/, ops/runtime/,
          # Claude/) are already absent; the excludes below are defensive
          # parity for running the same snippet locally.
          python - <<'PY'
          import py_compile, sys
          from pathlib import Path
          fails, count = [], 0
          for p in Path(".").rglob("*.py"):
              parts = p.parts
              if "__pycache__" in parts or "_archive" in parts or ".git" in parts:
                  continue
              count += 1
              try:
                  py_compile.compile(str(p), doraise=True)
              except Exception as exc:
                  fails.append((p, exc))
          if fails:
              for p, exc in fails:
                  print(f"FAIL: {p}: {exc}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {count} .py files compile clean")
          PY

      - name: ruff lint
        run: ruff check .

      - name: authored-source hygiene + tests
        run: |
          # Runs everything under tests/ so new suites are picked up
          # automatically as the repo grows - no per-path list to forget to
          # update. Today that is the three ASCII-hygiene guards: no smart
          # quotes / em-en dashes / NBSP / ellipsis / mojibake / U+2500
          # box-drawing in authored source. A test failure or a collection
          # error fails the job - no exit-code masking. Catches authored-text
          # drift at PR time so it is never dismissed as "pre-existing / not
          # in CI".
          pytest tests/ -q --tb=line

      - name: style drift gate
        run: |
          # tools/strip_em_dashes.py --check is the dry-run drift gate: it exits
          # 1 if any em/en dash or smart quote is present in tracked authored
          # text (git ls-files enumeration = tracked files only). Pure stdlib.
          #
          # MOVED here from the nightly job. It was nightly-only for exactly one
          # reason - the .md surface it scans was excluded from per-push CI by
          # the docs-only paths-ignore - and that filter is gone, so the gate now
          # runs where it can actually block. A nightly gate does not block; it
          # reports, up to 24h after the drift is already on main.
          python tools/strip_em_dashes.py --check

  # ---------------------------------------------------------------------------
  # CV lane. Separate job on purpose: the `check` job above stays fast and pure
  # stdlib, and only this one pays for the ~120MB numeric stack.
  #
  # WHY IT EXISTS: tests/test_lw_clean_dekel_align.py importorskips cv2 +
  # skimage, so on the stdlib-only `check` job it SKIPS - and a skipped test is
  # a green tick that proves nothing. align_rois shipped with zero coverage for
  # exactly this reason. This lane makes it actually regress.
  # ---------------------------------------------------------------------------
  cv-lane:
    # No schedule guard, unlike `check`: this lane runs on the nightly cron TOO.
    # Otherwise the nightly "full suite" would cover strictly LESS than a push
    # does, since nightly-full-suite installs only requirements.txt and the
    # dekel tests skip there.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install the CV numeric stack
        run: |
          python -m pip install --upgrade pip
          # All four resolve to wheels on cp314 manylinux (opencv ships
          # cp37-abi3, which covers 3.14) - verified 2026-08-02. If pip ever
          # starts BUILDING one of these from source the job will crawl or
          # die, and that is the signal to pin.
          pip install -r requirements-cv.txt

      - name: arm the git-hook gate
        run: |
          # Same reason as the `check` job: core.hooksPath is LOCAL config and
          # is never cloned, so a fresh checkout has .githooks INERT. This lane
          # runs a subset that does not itself read the gate, but arming is two
          # cheap idempotent commands and it keeps tests/test_ci_gate_arming.py
          # strict - the alternative was loosening that guard's matcher, which
          # would punch a hole for the next job that DOES need the gate.
          python tools/install_git_hooks.py
          python tools/install_git_hooks.py --check

      - name: prove the CV deps actually imported
        run: |
          # Guard against a half-installed stack silently turning the suite
          # below back into skips.
          python -c "import cv2, numpy, scipy, skimage; print('cv2', cv2.__version__, '| numpy', numpy.__version__, '| scipy', scipy.__version__, '| skimage', skimage.__version__)"

      - name: dekel alignment suite
        run: |
          pytest tests/test_lw_clean_dekel_align.py -q --tb=short \
            --junitxml=cv-lane.xml

      - name: fail on a silently-skipped suite
        if: always()
        run: |
          # THE POINT OF THIS LANE. Without this step an importorskip that
          # stops resolving turns the whole job green while testing nothing -
          # the precise false-green this lane was added to remove. Demand a
          # positive count of executed tests and zero skips.
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("cv-lane.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          errors = int(suite.get("errors", 0))
          failures = int(suite.get("failures", 0))
          print(f"tests={total} skipped={skipped} failures={failures} errors={errors}")
          if total - skipped < 10:
              sys.exit(f"FALSE GREEN: only {total - skipped} test(s) actually ran "
                       f"(expected >= 10). The CV deps are not resolving.")
          if skipped:
              sys.exit(f"FALSE GREEN: {skipped} test(s) skipped in the lane whose "
                       f"entire purpose is that they do not skip.")
          print("cv-lane executed its suite for real.")
          PY
